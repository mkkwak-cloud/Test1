<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drive Sim Lite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D viewport; instrument-style HUD floats on top (stats + minimap top, controls bottom). */
:root {
  --bg: #dfe4ea;
  --panel: rgba(250, 251, 252, 0.84);
  --line: rgba(20, 24, 29, 0.16);
  --fg: #14181d;
  --muted: #55606b;
  --accent: #b85f00;
  --accent-fg: #ffffff;
  --map-road: rgba(20, 24, 29, 0.28);
  --map-car: #55606b;
  --font-ui: 'Barlow Semi Condensed', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-num: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1014;
    --panel: rgba(16, 20, 25, 0.8);
    --line: rgba(255, 255, 255, 0.15);
    --fg: #e8ebee;
    --muted: #98a3ae;
    --accent: #ffb02e;
    --accent-fg: #1a1200;
    --map-road: rgba(255, 255, 255, 0.28);
    --map-car: #98a3ae;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1014;
  --panel: rgba(16, 20, 25, 0.8);
  --line: rgba(255, 255, 255, 0.15);
  --fg: #e8ebee;
  --muted: #98a3ae;
  --accent: #ffb02e;
  --accent-fg: #1a1200;
  --map-road: rgba(255, 255, 255, 0.28);
  --map-car: #98a3ae;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); overflow: hidden; }
#app { position: relative; height: 100%; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.top {
  position: absolute; top: 16px; left: 16px; right: 16px;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.info { flex: 0 1 216px; min-width: 0; padding: 12px 14px; }
.info h1 { margin: 0; font-size: 1.15rem; font-weight: 600; letter-spacing: 0.02em; }
.info .sub { margin: 2px 0 0; font-size: 0.78rem; color: var(--muted); }
.speed { display: flex; align-items: baseline; gap: 6px; margin: 10px 0 8px; }
.speed b { font-family: var(--font-num); font-weight: 500; font-size: 2.1rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 2.4ch; text-align: right; }
.speed small { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; }
.stats { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 0.86rem; }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }
.hint { margin: 10px 0 0; font-size: 0.74rem; line-height: 1.35; color: var(--muted); }
.mapbox { flex: none; width: clamp(104px, 28vw, 150px); padding: 6px; }
.mapbox canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; }

.bar {
  position: absolute; left: 16px; right: 16px; bottom: 16px;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
  pointer-events: none;
}
.grp { display: flex; align-items: center; gap: 6px; padding: 6px 8px; pointer-events: auto; }
.grp .lab { font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 0 4px; }
.grp .seg { display: flex; gap: 4px; }
button {
  font: 500 0.86rem/1 var(--font-ui); color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 600px) { .hint { display: none; } }
</style>

<div id="app">
  <canvas id="view" tabindex="0" aria-label="3D 주행 시뮬레이션 화면"></canvas>

  <div class="top">
    <section class="panel info">
      <h1>Drive Sim Lite</h1>
      <p class="sub">three.js · 브라우저 단독 실행</p>
      <div class="speed"><b id="spd">0</b><small>km/h</small></div>
      <dl class="stats">
        <dt>모드</dt><dd id="modeTxt">자율</dd>
        <dt>앞차 간격</dt><dd id="gap">—</dd>
        <dt>FPS</dt><dd id="fps">–</dd>
        <dt>Draw calls</dt><dd id="calls">–</dd>
        <dt>삼각형</dt><dd id="tris">–</dd>
      </dl>
      <p class="hint">수동: W/S 가속·제동, A/D 조향<br>C 시점 전환 · M 모드 전환</p>
    </section>
    <section class="panel mapbox"><canvas id="map" width="300" height="300"></canvas></section>
  </div>

  <div class="bar">
    <div class="panel grp"><span class="lab">모드</span>
      <div class="seg" id="segMode">
        <button data-v="auto" aria-pressed="true">자율</button>
        <button data-v="manual" aria-pressed="false">수동</button>
      </div>
    </div>
    <div class="panel grp"><span class="lab">시점</span>
      <div class="seg" id="segView">
        <button data-v="chase" aria-pressed="true">추적</button>
        <button data-v="hood" aria-pressed="false">운전석</button>
        <button data-v="top" aria-pressed="false">탑뷰</button>
      </div>
    </div>
    <div class="panel grp"><span class="lab">화면</span>
      <div class="seg" id="segStyle">
        <button data-v="real" aria-pressed="true">실사풍</button>
        <button data-v="fsd" aria-pressed="false">FSD 스타일</button>
      </div>
    </div>
    <div class="panel grp"><span class="lab">화질</span>
      <div class="seg" id="segQual">
        <button data-v="hi" aria-pressed="true">높음</button>
        <button data-v="lo" aria-pressed="false">낮음</button>
      </div>
    </div>
    <div class="panel grp"><button id="btnReset">초기화</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var T = THREE;

  /* ---------- helpers ---------- */
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var wrapPi = function (a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
  var col = function (hex) { return new T.Color(hex).convertSRGBToLinear(); };
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rand = rng(7);

  /* ---------- renderer / scene ---------- */
  var app = document.getElementById('app');
  var canvas = document.getElementById('view');
  var renderer = new T.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;

  var scene = new T.Scene();
  var camera = new T.PerspectiveCamera(60, 1, 0.3, 1500);
  var HORIZON = col(0xbdd0e4);
  scene.fog = new T.Fog(HORIZON, 120, 520);

  function makeSky() {
    var g = new T.SphereGeometry(900, 32, 16);
    var pos = g.attributes.position, colors = new Float32Array(pos.count * 3);
    var top = col(0x2c68b0), hor = HORIZON, gnd = col(0x3b4838), c = new T.Color();
    for (var i = 0; i < pos.count; i++) {
      var y = pos.getY(i) / 900;
      if (y >= 0) c.copy(hor).lerp(top, Math.pow(y, 0.55)); else c.copy(hor).lerp(gnd, Math.min(1, -y * 5));
      colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
    }
    g.setAttribute('color', new T.BufferAttribute(colors, 3));
    return new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide, fog: false, depthWrite: false, toneMapped: false }));
  }
  var sky = makeSky();
  scene.add(sky);

  // Reflection environment generated from the same sky (plus a bright sun disc) so car paint has something to mirror.
  var SUN_DIR = new T.Vector3(-0.55, 0.62, 0.45).normalize();
  (function () {
    var envScene = new T.Scene();
    envScene.add(makeSky());
    var sun = new T.Mesh(new T.SphereGeometry(70, 16, 8), new T.MeshBasicMaterial({ color: new T.Color(40, 36, 28) }));
    sun.position.copy(SUN_DIR).multiplyScalar(800);
    envScene.add(sun);
    var pm = new T.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(envScene, 0.02).texture;
    pm.dispose();
  })();

  var sun = new T.DirectionalLight(0xfff1dc, 2.4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  var sc = sun.shadow.camera; sc.left = -70; sc.right = 70; sc.top = 70; sc.bottom = -70; sc.near = 1; sc.far = 500;
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.05;
  scene.add(sun); scene.add(sun.target);
  scene.add(new T.HemisphereLight(0xcfe0f5, 0x4a5a40, 0.45));

  /* ---------- track (centerline spline, OpenDRIVE-like: reference line + lane offsets) ---------- */
  var ctrl = [[0,-220],[150,-180],[230,-40],[170,90],[60,60],[-20,150],[-140,200],[-230,80],[-170,-60],[-90,-170]]
    .map(function (p) { return new T.Vector3(p[0], 0, p[1]); });
  var curve = new T.CatmullRomCurve3(ctrl, true, 'centripetal');
  curve.arcLengthDivisions = 3000;
  var N = 1200, LEN = curve.getLength(), DS = LEN / N;
  var px = new Float32Array(N + 1), pz = new Float32Array(N + 1), tx = new Float32Array(N + 1), tz = new Float32Array(N + 1);
  for (var i = 0; i <= N; i++) {
    var u = (i % N) / N, p = curve.getPointAt(u), t = curve.getTangentAt(u), l = Math.hypot(t.x, t.z);
    px[i] = p.x; pz[i] = p.z; tx[i] = t.x / l; tz[i] = t.z / l;
  }
  var kap = new Float32Array(N), kapS = new Float32Array(N);
  for (i = 0; i < N; i++) kap[i] = Math.abs(wrapPi(Math.atan2(tx[i + 1], tz[i + 1]) - Math.atan2(tx[i], tz[i]))) / DS;
  for (i = 0; i < N; i++) { var sacc = 0; for (var k = -4; k <= 4; k++) sacc += kap[(i + k + N) % N]; kapS[i] = sacc / 9; }

  var wrapS = function (s) { return ((s % LEN) + LEN) % LEN; };
  // Point on the lane at arc position s, lateral offset d (+ = right of the s-direction).
  function sample(s, d, out) {
    var f = wrapS(s) / DS, i0 = Math.min(Math.floor(f), N - 1), a = f - i0, j = i0 + 1;
    var x = px[i0] + (px[j] - px[i0]) * a, z = pz[i0] + (pz[j] - pz[i0]) * a;
    var ux = tx[i0] + (tx[j] - tx[i0]) * a, uz = tz[i0] + (tz[j] - tz[i0]) * a, ul = Math.hypot(ux, uz);
    ux /= ul; uz /= ul;
    out.x = x - uz * d; out.z = z + ux * d; out.h = Math.atan2(ux, uz);
    return out;
  }

  /* ---------- environment meshes ---------- */
  function canvasTex(w, h, draw) {
    var c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    var tex = new T.CanvasTexture(c); tex.encoding = T.sRGBEncoding;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }
  var roadTex = canvasTex(512, 512, function (g, w, h) {
    g.fillStyle = '#3a3e44'; g.fillRect(0, 0, w, h);
    for (var n = 0; n < 12000; n++) { var v = 38 + Math.random() * 56 | 0; g.fillStyle = 'rgba(' + v + ',' + v + ',' + (v + 4) + ',0.55)'; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
    g.fillStyle = 'rgba(0,0,0,0.13)';
    [0.217, 0.395, 0.605, 0.783].forEach(function (uu) { g.fillRect(uu * w - 12, 0, 24, h); });
    g.fillStyle = '#e9e9e4';
    g.fillRect(0.055 * w - 4, 0, 8, h); g.fillRect(0.945 * w - 4, 0, 8, h);
    g.fillRect(w / 2 - 4, 0, 8, h * 0.25);
  });
  roadTex.wrapT = T.RepeatWrapping;

  var grassTex = canvasTex(256, 256, function (g, w, h) {
    g.fillStyle = '#51703d'; g.fillRect(0, 0, w, h);
    var cs = ['#476534', '#5d7d45', '#3f5b2e', '#68894d', '#566f3f'];
    for (var n = 0; n < 5000; n++) { g.fillStyle = cs[n % cs.length]; g.fillRect(Math.random() * w, Math.random() * h, 2, 3); }
  });
  grassTex.wrapS = grassTex.wrapT = T.RepeatWrapping; grassTex.repeat.set(260, 260);

  var ground = new T.Mesh(new T.PlaneGeometry(3000, 3000).rotateX(-Math.PI / 2), new T.MeshStandardMaterial({ map: grassTex, roughness: 1, metalness: 0 }));
  ground.position.y = -0.06; ground.receiveShadow = true; scene.add(ground);

  var roadMesh, deco = [];
  (function buildRoad() {
    var W = 4.5, pos = new Float32Array((N + 1) * 6), nor = new Float32Array((N + 1) * 6), uv = new Float32Array((N + 1) * 4), idx = [];
    var tiles = Math.round(LEN / 12);
    for (var i = 0; i <= N; i++) {
      var rx = -tz[i], rz = tx[i], v = i / N * tiles, o = i * 6;
      pos[o] = px[i] + rx * W; pos[o + 1] = 0; pos[o + 2] = pz[i] + rz * W;
      pos[o + 3] = px[i] - rx * W; pos[o + 4] = 0; pos[o + 5] = pz[i] - rz * W;
      nor[o + 1] = 1; nor[o + 4] = 1;
      uv[i * 4] = 1; uv[i * 4 + 1] = v; uv[i * 4 + 2] = 0; uv[i * 4 + 3] = v;
      if (i < N) { var a0 = i * 2, b0 = a0 + 1, a1 = a0 + 2, b1 = a0 + 3; idx.push(a0, a1, b0, b0, a1, b1); }
    }
    var g = new T.BufferGeometry();
    g.setAttribute('position', new T.BufferAttribute(pos, 3)); g.setAttribute('normal', new T.BufferAttribute(nor, 3)); g.setAttribute('uv', new T.BufferAttribute(uv, 2));
    g.setIndex(idx);
    var m = new T.Mesh(g, new T.MeshStandardMaterial({ map: roadTex, roughness: 0.92, metalness: 0, side: T.DoubleSide }));
    m.receiveShadow = true; scene.add(m); roadMesh = m;
  })();

  var dummy = new T.Object3D(), tmp = { x: 0, z: 0, h: 0 };
  // Roadside delineator posts
  (function () {
    var cnt = Math.floor(LEN / 15) * 2;
    var im = new T.InstancedMesh(new T.BoxGeometry(0.12, 0.9, 0.12), new T.MeshStandardMaterial({ color: col(0xe4e6e8), roughness: 0.6 }), cnt);
    var n = 0;
    for (var s = 0; s < LEN - 15 && n < cnt; s += 15) {
      [-5.3, 5.3].forEach(function (d) { sample(s, d, tmp); dummy.position.set(tmp.x, 0.45, tmp.z); dummy.rotation.y = tmp.h; dummy.updateMatrix(); im.setMatrixAt(n++, dummy.matrix); });
    }
    im.count = n; im.castShadow = true; scene.add(im); deco.push(im);
  })();

  function farFromTrack(x, z, minD) {
    var m2 = minD * minD;
    for (var i = 0; i < N; i += 4) { var dx = px[i] - x, dz = pz[i] - z; if (dx * dx + dz * dz < m2) return false; }
    return true;
  }

  var trees = (function () {
    var MAX = 420;
    var trunk = new T.InstancedMesh(new T.CylinderGeometry(0.22, 0.34, 2.4, 6).translate(0, 1.2, 0), new T.MeshStandardMaterial({ color: col(0x5a4330), roughness: 1 }), MAX);
    var crown = new T.InstancedMesh(new T.ConeGeometry(2.3, 7, 7).translate(0, 5.4, 0), new T.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9, flatShading: true }), MAX);
    var greens = [0x2f5f2e, 0x3a6d33, 0x28552c, 0x467a39, 0x335f35].map(col), n = 0, tries = 0;
    while (n < MAX && tries++ < 4000) {
      var x = (rand() - 0.5) * 900, z = (rand() - 0.5) * 900;
      if (!farFromTrack(x, z, 13)) continue;
      var sc = 0.8 + rand() * 0.9;
      dummy.position.set(x, 0, z); dummy.rotation.set(0, rand() * 6.28, 0); dummy.scale.set(sc, sc * (0.9 + rand() * 0.4), sc); dummy.updateMatrix();
      trunk.setMatrixAt(n, dummy.matrix); crown.setMatrixAt(n, dummy.matrix); crown.setColorAt(n, greens[n % greens.length]); n++;
    }
    dummy.scale.set(1, 1, 1);
    trunk.count = crown.count = n; trunk.castShadow = crown.castShadow = true;
    scene.add(trunk); scene.add(crown); deco.push(trunk, crown);
    return { meshes: [trunk, crown], n: n };
  })();

  (function () {
    var MAX = 38, g = new T.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
    var im = new T.InstancedMesh(g, new T.MeshStandardMaterial({ color: 0xffffff, roughness: 0.75, metalness: 0.05 }), MAX);
    var greys = [0xb9bdc2, 0x9aa1a8, 0xc9c2b6, 0x8c949c, 0xa9b3bd].map(col), n = 0, tries = 0;
    while (n < MAX && tries++ < 3000) {
      var si = Math.floor(rand() * N), side = rand() < 0.5 ? -1 : 1, off = side * (55 + rand() * 70);
      var x = px[si] - tz[si] * off, z = pz[si] + tx[si] * off;
      if (!farFromTrack(x, z, 42)) continue;
      var w = 14 + rand() * 18, d = 14 + rand() * 18, h = 9 + rand() * 38;
      dummy.position.set(x, 0, z); dummy.rotation.set(0, rand() * 3.14, 0); dummy.scale.set(w, h, d); dummy.updateMatrix();
      im.setMatrixAt(n, dummy.matrix); im.setColorAt(n, greys[n % greys.length]); n++;
    }
    dummy.scale.set(1, 1, 1);
    im.count = n; im.castShadow = true; im.receiveShadow = true; scene.add(im); deco.push(im);
  })();

  /* ---------- vehicle model ---------- */
  function profileGeo(pts, depth, bevel) {
    var sh = new T.Shape();
    pts.forEach(function (p, i) { if (i) sh.lineTo(p[0], p[1]); else sh.moveTo(p[0], p[1]); });
    var g = new T.ExtrudeGeometry(sh, { depth: depth, bevelEnabled: bevel > 0, bevelSize: bevel, bevelThickness: bevel, bevelSegments: 2, steps: 1 });
    g.translate(0, 0, -depth / 2); g.rotateY(-Math.PI / 2);
    return g;
  }
  var G = {
    hull: profileGeo([[-2.25,0.3],[2.25,0.3],[2.25,0.65],[1.7,0.86],[0.9,0.92],[-1.6,0.92],[-2.25,0.86]], 1.62, 0.09),
    glass: profileGeo([[0.95,0.9],[0.42,1.4],[-0.95,1.4],[-1.55,0.9]], 1.36, 0.03),
    roof: new T.BoxGeometry(1.46, 0.05, 1.38).translate(0, 1.43, -0.27),
    tire: new T.CylinderGeometry(0.34, 0.34, 0.24, 20).rotateZ(Math.PI / 2),
    rim: new T.CylinderGeometry(0.21, 0.21, 0.26, 12).rotateZ(Math.PI / 2),
    head: new T.BoxGeometry(0.3, 0.1, 0.06),
    tail: new T.BoxGeometry(0.36, 0.09, 0.05)
  };
  var glassMat = new T.MeshStandardMaterial({ color: 0x080d12, metalness: 0.9, roughness: 0.08 });
  var tireMat = new T.MeshStandardMaterial({ color: 0x121212, roughness: 0.95 });
  var rimMat = new T.MeshStandardMaterial({ color: col(0xb8bdc4), metalness: 0.9, roughness: 0.3 });
  var headMat = new T.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff2cc, emissiveIntensity: 2 });

  function makeCar(hex) {
    var g = new T.Group();
    var body = new T.MeshPhysicalMaterial({ color: col(hex), metalness: 0.55, roughness: 0.32, clearcoat: 1, clearcoatRoughness: 0.06 });
    var hull = new T.Mesh(G.hull, body); hull.castShadow = true; g.add(hull);
    var glass = new T.Mesh(G.glass, glassMat); g.add(glass); var hide = [glass];
    var roof = new T.Mesh(G.roof, body); roof.castShadow = true; g.add(roof);
    var tailMat = new T.MeshStandardMaterial({ color: 0x300000, emissive: 0xff1010, emissiveIntensity: 0.5 });
    [-1, 1].forEach(function (sx) {
      var tl = new T.Mesh(G.tail, tailMat); tl.position.set(sx * 0.62, 0.72, -2.33); g.add(tl); hide.push(tl);
      var hl = new T.Mesh(G.head, headMat); hl.position.set(sx * 0.62, 0.68, 2.33); g.add(hl); hide.push(hl);
    });
    var rolls = [], fronts = [];
    [-1, 1].forEach(function (sx) {
      [1.38, -1.38].forEach(function (fz) {
        var pivot = new T.Group(); pivot.position.set(sx * 0.86, 0.34, fz);
        var roll = new T.Group();
        var tire = new T.Mesh(G.tire, tireMat); tire.castShadow = true;
        roll.add(tire); roll.add(new T.Mesh(G.rim, rimMat));
        pivot.add(roll); g.add(pivot); hide.push(pivot); rolls.push(roll); if (fz > 0) fronts.push(pivot);
      });
    });
    scene.add(g);
    return { mesh: g, rolls: rolls, fronts: fronts, tailMat: tailMat, hull: hull, roof: roof, body: body, hide: hide };
  }

  /* ---------- simulation state ---------- */
  var CAR_LEN = 4.5, WB = 2.8, V_DES = 15.5, A_LAT = 3.2;
  var ego = { kind: 'ego', lane: 'R', dir: 1, s: 0, si: 0, v: 0, x: 0, z: 0, th: 0, delta: 0, brake: false, gap: null, view: makeCar(0xe86a00) };
  var traffic = [];
  var palette = [0xd9dde3, 0x1c1f24, 0xa3121f, 0x2f5d8a, 0xe0b020, 0x6c7a89, 0x2b6e4f, 0xe8e8e8];
  function addTraffic(lane, sFrac, base, amp, w) {
    traffic.push({ kind: 'tr', lane: lane, dir: lane === 'R' ? 1 : -1, s: sFrac * LEN, v: base, vBase: base, amp: amp, w: w, ph: rand() * 6.28, brake: false,
      view: makeCar(palette[traffic.length % palette.length]) });
  }
  [[0.07, 10, 3, 0.35], [0.30, 12, 2, 0.28], [0.55, 9, 2, 0.4], [0.80, 11, 3, 0.31]].forEach(function (a) { addTraffic('R', a[0], a[1], a[2], a[3]); });
  [[0.12, 13, 2, 0.2], [0.37, 12, 2, 0.25], [0.62, 14, 2, 0.22], [0.87, 13, 1, 0.3]].forEach(function (a) { addTraffic('L', a[0], a[1], a[2], a[3]); });
  var all = traffic.concat([ego]);

  var targetMark = new T.Mesh(new T.SphereGeometry(0.28, 12, 8), new T.MeshBasicMaterial({ color: 0xffb02e, toneMapped: false }));
  scene.add(targetMark);

  function resetEgo() {
    sample(60, 1.75, tmp);
    ego.s = 60; ego.si = Math.round(60 / DS); ego.x = tmp.x; ego.z = tmp.z; ego.th = tmp.h; ego.v = 8; ego.delta = 0;
    traffic[0].s = 112; traffic[0].v = traffic[0].vBase;
  }
  resetEgo();

  function findLead(c) {
    var best = null, bd = 1e9;
    for (var i = 0; i < all.length; i++) {
      var o = all[i]; if (o === c || o.lane !== c.lane) continue;
      var d = c.dir > 0 ? wrapS(o.s - c.s) : wrapS(c.s - o.s);
      if (d < bd) { bd = d; best = o; }
    }
    return best && bd < 160 ? { o: best, gap: bd - CAR_LEN } : null;
  }
  function accSpeed(v, lead) { return Math.max(0, lead.o.v + 0.55 * (lead.gap - (5 + 1.5 * v))); }

  var mode = 'auto', simT = 0, keys = {};

  function stepTraffic(dt) {
    for (var i = 0; i < traffic.length; i++) {
      var c = traffic[i], vt = c.vBase + c.amp * Math.sin(simT * c.w + c.ph), lead = findLead(c);
      if (lead) vt = Math.min(vt, accSpeed(c.v, lead));
      var a = clamp(1.2 * (vt - c.v), -6, 2.2);
      c.v = Math.max(0, c.v + a * dt); c.brake = a < -0.8;
      c.s = wrapS(c.s + c.dir * c.v * dt);
    }
  }

  function stepEgo(dt) {
    var e = ego, best = 1e18, bi = e.si, j, ii, dx, dz, d2;
    function scan(from, to) {
      for (j = from; j <= to; j++) {
        ii = ((e.si + j) % N + N) % N;
        dx = px[ii] - tz[ii] * 1.75 - e.x; dz = pz[ii] + tx[ii] * 1.75 - e.z; d2 = dx * dx + dz * dz;
        if (d2 < best) { best = d2; bi = ii; }
      }
    }
    scan(-30, 30);
    if (best > 400) { scan(-N / 2, N / 2); }
    e.si = bi; e.s = bi * DS;

    var lead = findLead(e); e.gap = lead ? lead.gap : null;
    var a, steerT;
    if (mode === 'auto') {
      var Ld = clamp(5 + 0.7 * e.v, 6, 28);
      sample(e.s + Ld, 1.75, tmp);
      targetMark.position.set(tmp.x, 0.4, tmp.z);
      var alpha = wrapPi(Math.atan2(tmp.x - e.x, tmp.z - e.z) - e.th);
      steerT = Math.atan2(2 * WB * Math.sin(alpha), Ld);
      var look = Math.ceil((12 + e.v * 3) / DS), kmax = 0;
      for (j = 0; j <= look; j++) kmax = Math.max(kmax, kapS[(e.si + j) % N]);
      var vt = Math.min(V_DES, Math.sqrt(A_LAT / Math.max(kmax, 1e-4)));
      if (lead) vt = Math.min(vt, accSpeed(e.v, lead));
      a = clamp(1.0 * (vt - e.v), -7, 2.5);
    } else {
      var thr = (keys.w || keys.arrowup) ? 1 : 0, brk = (keys.s || keys.arrowdown) ? 1 : 0;
      a = thr * 3.2 - brk * 8 - (thr || brk ? 0 : 0.5);
      var str = ((keys.a || keys.arrowleft) ? 1 : 0) - ((keys.d || keys.arrowright) ? 1 : 0);
      steerT = str * 0.5 / (1 + e.v / 10);
      targetMark.position.set(e.x, -5, e.z);
    }
    e.delta += clamp(clamp(steerT, -0.55, 0.55) - e.delta, -1.6 * dt, 1.6 * dt);
    e.v = Math.max(0, e.v + a * dt); e.brake = a < -0.8;
    e.th += e.v / WB * Math.tan(e.delta) * dt;
    e.x += e.v * Math.sin(e.th) * dt; e.z += e.v * Math.cos(e.th) * dt;
  }

  function applyVisual(c, dt) {
    var m = c.view.mesh;
    if (c.kind === 'ego') { m.position.set(c.x, 0, c.z); m.rotation.y = c.th; }
    else { sample(c.s, c.lane === 'R' ? 1.75 : -1.75, tmp); m.position.set(tmp.x, 0, tmp.z); m.rotation.y = tmp.h + (c.dir < 0 ? Math.PI : 0); }
    var r = c.v * dt / 0.34;
    for (var i = 0; i < c.view.rolls.length; i++) c.view.rolls[i].rotation.x += r;
    var dl = c.kind === 'ego' ? c.delta : 0;
    for (i = 0; i < c.view.fronts.length; i++) c.view.fronts[i].rotation.y = dl;
    c.view.tailMat.emissiveIntensity = c.brake ? 4 : 0.5;
  }

  /* ---------- camera ---------- */
  var styleMode = 'real';
  function applyFov() { camera.fov = view === 'hood' ? 72 : (styleMode === 'fsd' ? 52 : 60); camera.updateProjectionMatrix(); }
  var view = 'chase', camPos = new T.Vector3(), camLook = new T.Vector3(), wantPos = new T.Vector3(), wantLook = new T.Vector3();
  function updateCamera(dt, snap) {
    var fx = Math.sin(ego.th), fz = Math.cos(ego.th), k = snap ? 1 : 1 - Math.exp(-dt * 5);
    camera.up.set(0, 1, 0);
    if (view === 'chase') { var fsd = styleMode === 'fsd'; wantPos.set(ego.x - fx * (fsd ? 11 : 9.5), fsd ? 5.6 : 3.8, ego.z - fz * (fsd ? 11 : 9.5)); wantLook.set(ego.x + fx * (fsd ? 14 : 8), 1.1, ego.z + fz * (fsd ? 14 : 8)); }
    else if (view === 'hood') { wantPos.set(ego.x + fx * 0.3, 1.28, ego.z + fz * 0.3); wantLook.set(ego.x + fx * 30, 1.1, ego.z + fz * 30); k = 1; }
    else { wantPos.set(ego.x, 120, ego.z); wantLook.set(ego.x, 0, ego.z); camera.up.set(fx, 0, fz); k = 1; }
    camPos.lerp(wantPos, k); camLook.lerp(wantLook, k);
    camera.position.copy(camPos); camera.lookAt(camLook);
    sky.position.copy(camera.position);
  }
  function setView(v) {
    view = v; applyFov();
    ego.view.mesh.visible = true; updateCamera(0, true);
  }

  /* ---------- quality ---------- */
  var quality = 'hi';
  function resize() {
    var w = Math.max(1, app.clientWidth), h = Math.max(1, app.clientHeight);
    renderer.setPixelRatio(quality === 'hi' ? Math.min(window.devicePixelRatio || 1, 2) : 0.6);
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  function setQuality(q) {
    quality = q; var hi = q === 'hi';
    sun.castShadow = hi; renderer.shadowMap.enabled = hi;
    trees.meshes.forEach(function (m) { m.count = hi ? trees.n : Math.floor(trees.n * 0.3); });
    scene.fog.far = styleMode === 'fsd' ? 240 : (hi ? 520 : 260); camera.far = hi ? 1500 : 700; camera.updateProjectionMatrix();
    scene.traverse(function (o) { if (o.material) [].concat(o.material).forEach(function (m) { m.needsUpdate = true; }); });
    resize();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(app); else window.addEventListener('resize', resize);

  /* ---------- FSD-style visualization (flat gray traffic, lane lines, blue path ribbon) ---------- */
  var FSD_BG = col(0xdcdbe6);
  var fsdRoadTex = canvasTex(512, 512, function (g, w, h) {
    g.fillStyle = '#eeedf5'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#9897ab';
    g.fillRect(0.055 * w - 3, 0, 6, h); g.fillRect(0.945 * w - 3, 0, 6, h);
    g.fillRect(w / 2 - 3, 0, 6, h * 0.25);
  });
  fsdRoadTex.wrapT = T.RepeatWrapping;
  var realRoadMat = roadMesh.material, realGroundMat = ground.material;
  var fsdRoadMat = new T.MeshBasicMaterial({ map: fsdRoadTex, side: T.DoubleSide });
  var fsdGroundMat = new T.MeshBasicMaterial({ color: col(0xcbcad8) });
  var fsdEgo = new T.MeshLambertMaterial({ color: col(0x2a5bff), emissive: col(0x0b1f80) });
  var fsdOther = new T.MeshLambertMaterial({ color: col(0x8d8c9e), emissive: col(0x14141c), transparent: true, opacity: 0.93 });
  var RM = 40, ribPos = new Float32Array((RM + 1) * 6), ribIdx = [];
  for (i = 0; i < RM; i++) { var q = i * 2; ribIdx.push(q, q + 2, q + 1, q + 1, q + 2, q + 3); }
  var ribGeo = new T.BufferGeometry();
  ribGeo.setAttribute('position', new T.BufferAttribute(ribPos, 3)); ribGeo.setIndex(ribIdx);
  var ribMesh = new T.Mesh(ribGeo, new T.MeshBasicMaterial({ color: 0x2f6bff, transparent: true, opacity: 0.78, side: T.DoubleSide, depthWrite: false, toneMapped: false }));
  ribMesh.frustumCulled = false; ribMesh.visible = false; scene.add(ribMesh);
  function updateRibbon() {
    var len = ego.gap != null ? clamp(ego.gap, 5, 55) : 55, ex = ego.x, ez = ego.z;
    for (var i = 0; i <= RM; i++) {
      sample(ego.s + 2.5 + len * i / RM, 1.75, tmp);
      var b = Math.min(1, i / 10), x = ex + (tmp.x - ex) * b, z = ez + (tmp.z - ez) * b;
      var rx = -Math.cos(tmp.h) * 0.85, rz = Math.sin(tmp.h) * 0.85, o = i * 6;
      ribPos[o] = x + rx; ribPos[o + 1] = 0.06; ribPos[o + 2] = z + rz;
      ribPos[o + 3] = x - rx; ribPos[o + 4] = 0.06; ribPos[o + 5] = z - rz;
    }
    ribGeo.attributes.position.needsUpdate = true;
  }
  function setStyle(s) {
    var f = s === 'fsd'; styleMode = s;
    roadMesh.material = f ? fsdRoadMat : realRoadMat; ground.material = f ? fsdGroundMat : realGroundMat;
    deco.forEach(function (m) { m.visible = !f; });
    sky.visible = !f; scene.background = f ? FSD_BG : null;
    scene.fog.color.copy(f ? FSD_BG : HORIZON); scene.fog.near = f ? 50 : 120; scene.fog.far = f ? 240 : (quality === 'hi' ? 520 : 260);
    renderer.toneMapping = f ? T.NoToneMapping : T.ACESFilmicToneMapping;
    all.forEach(function (c) {
      var v = c.view, m = f ? (c === ego ? fsdEgo : fsdOther) : v.body;
      v.hull.material = m; v.roof.material = m;
      v.hide.forEach(function (h) { h.visible = !f; });
    });
    ribMesh.visible = f; targetMark.visible = !f;
    applyFov();
    scene.traverse(function (o) { if (o.material) [].concat(o.material).forEach(function (mm) { mm.needsUpdate = true; }); });
  }

  /* ---------- HUD ---------- */
  var el = function (id) { return document.getElementById(id); };
  function seg(id, cb) {
    var box = el(id);
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      Array.prototype.forEach.call(box.children, function (c) { c.setAttribute('aria-pressed', c === b ? 'true' : 'false'); });
      cb(b.dataset.v);
    });
    return function (v) { Array.prototype.forEach.call(box.children, function (c) { c.setAttribute('aria-pressed', c.dataset.v === v ? 'true' : 'false'); }); };
  }
  var syncMode = seg('segMode', function (v) { mode = v; el('modeTxt').textContent = v === 'auto' ? '자율' : '수동'; });
  var syncView = seg('segView', setView);
  seg('segQual', setQuality);
  seg('segStyle', setStyle);
  el('btnReset').addEventListener('click', function () { resetEgo(); updateCamera(0, true); });
  var viewOrder = ['chase', 'hood', 'top'];
  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].indexOf(k) >= 0) e.preventDefault();
    keys[k] = true;
    if (k === 'c') { var nv = viewOrder[(viewOrder.indexOf(view) + 1) % 3]; syncView(nv); setView(nv); }
    if (k === 'm') { var nm = mode === 'auto' ? 'manual' : 'auto'; syncMode(nm); mode = nm; el('modeTxt').textContent = nm === 'auto' ? '자율' : '수동'; }
  });
  window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });
  canvas.addEventListener('pointerdown', function () { canvas.focus(); });

  // minimap (2D canvas: the cheap view of the same simulation state)
  var mm = el('map'), mctx = mm.getContext('2d'), bx0 = 1e9, bx1 = -1e9, bz0 = 1e9, bz1 = -1e9;
  for (i = 0; i < N; i++) { bx0 = Math.min(bx0, px[i]); bx1 = Math.max(bx1, px[i]); bz0 = Math.min(bz0, pz[i]); bz1 = Math.max(bz1, pz[i]); }
  var mk = (mm.width - 36) / Math.max(bx1 - bx0, bz1 - bz0), mox = (mm.width - (bx1 - bx0) * mk) / 2, moz = (mm.height - (bz1 - bz0) * mk) / 2;
  var mX = function (x) { return mox + (x - bx0) * mk; }, mZ = function (z) { return moz + (z - bz0) * mk; };
  var trackPath = new Path2D();
  for (i = 0; i < N; i += 6) { if (i) trackPath.lineTo(mX(px[i]), mZ(pz[i])); else trackPath.moveTo(mX(px[i]), mZ(pz[i])); }
  trackPath.closePath();
  var mapColors = { road: '#888', car: '#888', acc: '#e80' }, mapColorT = 0;
  function drawMap(now) {
    if (now - mapColorT > 500) {
      var cs = getComputedStyle(document.documentElement);
      mapColors.road = cs.getPropertyValue('--map-road').trim() || mapColors.road;
      mapColors.car = cs.getPropertyValue('--map-car').trim() || mapColors.car;
      mapColors.acc = cs.getPropertyValue('--accent').trim() || mapColors.acc;
      mapColorT = now;
    }
    mctx.clearRect(0, 0, mm.width, mm.height);
    mctx.lineJoin = 'round'; mctx.lineWidth = 12; mctx.strokeStyle = mapColors.road; mctx.stroke(trackPath);
    mctx.fillStyle = mapColors.car;
    for (var i = 0; i < traffic.length; i++) {
      var c = traffic[i]; sample(c.s, c.lane === 'R' ? 1.75 : -1.75, tmp);
      mctx.beginPath(); mctx.arc(mX(tmp.x), mZ(tmp.z), 5, 0, 6.283); mctx.fill();
    }
    mctx.save(); mctx.translate(mX(ego.x), mZ(ego.z)); mctx.rotate(-ego.th + Math.PI);
    mctx.fillStyle = mapColors.acc; mctx.beginPath(); mctx.moveTo(0, -11); mctx.lineTo(8, 9); mctx.lineTo(-8, 9); mctx.closePath(); mctx.fill();
    mctx.restore();
  }

  /* ---------- main loop ---------- */
  var STEP = 1 / 60, acc = 0, last = performance.now(), fpsN = 0, fpsT = last;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
    while (acc >= STEP) { simT += STEP; stepTraffic(STEP); stepEgo(STEP); acc -= STEP; }
    for (var i = 0; i < all.length; i++) applyVisual(all[i], dt);
    if (styleMode === 'fsd') updateRibbon();
    updateCamera(dt, false);
    sun.position.set(ego.x + SUN_DIR.x * 150, SUN_DIR.y * 150, ego.z + SUN_DIR.z * 150);
    sun.target.position.set(ego.x, 0, ego.z);
    renderer.render(scene, camera);
    drawMap(now);

    fpsN++;
    if (now - fpsT > 500) {
      el('fps').textContent = Math.round(fpsN * 1000 / (now - fpsT));
      el('calls').textContent = renderer.info.render.calls;
      el('tris').textContent = (renderer.info.render.triangles / 1000).toFixed(0) + 'k';
      el('spd').textContent = Math.round(ego.v * 3.6);
      el('gap').textContent = ego.gap == null ? '—' : ego.gap.toFixed(1) + ' m';
      fpsN = 0; fpsT = now;
    }
  }
  setQuality('hi');
  updateCamera(0, true);
  requestAnimationFrame(frame);
})();
</script>
</body></html>
